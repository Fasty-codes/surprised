<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Surprised</title>
  
  <!-- Apple Mobile Web App Settings -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Surprised">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #f8fafc;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      position: relative;
      overflow: hidden;
    }

    /* Floating Colorful Circles Background */
    .circle {
      position: absolute;
      border-radius: 50%;
      filter: blur(60px);
      opacity: 0.6;
      z-index: 1;
      animation: float 8s ease-in-out infinite alternate;
    }

    .circle-1 {
      width: 280px;
      height: 280px;
      background: #ff7675;
      top: -50px;
      left: -50px;
    }

    .circle-2 {
      width: 320px;
      height: 320px;
      background: #74b9ff;
      bottom: -80px;
      right: -50px;
      animation-delay: -3s;
    }

    .circle-3 {
      width: 220px;
      height: 220px;
      background: #55efc4;
      top: 40%;
      right: 10%;
      animation-delay: -5s;
    }

    .circle-4 {
      width: 250px;
      height: 250px;
      background: #a29bfe;
      bottom: 20%;
      left: 5%;
      animation-delay: -2s;
    }

    @keyframes float {
      0% { transform: translateY(0) scale(1); }
      100% { transform: translateY(-30px) scale(1.08); }
    }

    /* Card Container */
    .card {
      position: relative;
      z-index: 2;
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      padding: 2.5rem 2rem;
      border-radius: 28px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.06), 0 1px 3px rgba(0, 0, 0, 0.04);
      text-align: center;
      max-width: 380px;
      width: 100%;
      border: 1px solid rgba(255, 255, 255, 0.8);
    }

    .icon-box {
      width: 68px;
      height: 68px;
      background: rgba(108, 92, 231, 0.1);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.25rem;
      color: #6c5ce7;
    }

    .icon-box svg {
      width: 34px;
      height: 34px;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: #2d3436;
      margin-bottom: 0.5rem;
      letter-spacing: -0.01em;
    }

    p {
      font-size: 0.95rem;
      color: #636e72;
      margin-bottom: 1.75rem;
      line-height: 1.5;
    }

    button {
      background: linear-gradient(135deg, #0984e3, #6c5ce7);
      color: white;
      border: none;
      padding: 16px 28px;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 18px;
      cursor: pointer;
      width: 100%;
      transition: all 0.2s ease;
      box-shadow: 0 8px 20px rgba(9, 132, 227, 0.25);
    }

    button:active {
      transform: scale(0.97);
    }

    .status {
      margin-top: 1.25rem;
      font-size: 0.85rem;
      color: #636e72;
      font-weight: 500;
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <!-- Background Circles -->
  <div class="circle circle-1"></div>
  <div class="circle circle-2"></div>
  <div class="circle circle-3"></div>
  <div class="circle circle-4"></div>

  <div class="card">
    <div class="icon-box">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path>
      </svg>
    </div>
    
    <h1>Surprised</h1>
    <p>Welcome to Surprised! Stay connected to receive special alerts and updates.</p>
    
    <button id="enableBtn">Allow Notifications</button>
    
    <div id="status" class="status">allow notifications to get the updates and notifications from the app</div>
  </div>

  <script>
    const enableBtn = document.getElementById('enableBtn');
    const statusDiv = document.getElementById('status');

    // 1. SETTINGS
    const IS_TEST_MODE = true; // Set to 'true' for 5-sec test, 'false' for Sep 11
    const targetBirthdayDate = new Date('2026-09-11T00:00:00');

    // 2. REGISTER INLINE SERVICE WORKER
    async function registerSw() {
      if ('serviceWorker' in navigator) {
        const swCode = `
          self.addEventListener('message', event => {
            if (event.data && event.data.type === 'SCHEDULE_NOTIFICATION') {
              setTimeout(() => {
                self.registration.showNotification(event.data.title, event.data.options);
              }, event.data.delayMs);
            }
          });
        `;
        const blob = new Blob([swCode], { type: 'application/javascript' });
        const swUrl = URL.createObjectURL(blob);
        return await navigator.serviceWorker.register(swUrl);
      }
      return null;
    }

    // 3. SCHEDULE SURPRISE
    async function scheduleSurprise() {
      const now = new Date();
      let delayMs = IS_TEST_MODE ? 5000 : targetBirthdayDate.getTime() - now.getTime();

      if (delayMs <= 0) {
        statusDiv.innerText = "All notifications enabled!";
        return;
      }

      const title = "Happy Birthday, Dad!!!🥳";
      const options = {
        body: "We love you so much! Wishing you the happiest day ever! ❤️",
        icon: "https://cdn-icons-png.flaticon.com/512/3159/3159422.png",
        vibrate: [200, 100, 200]
      };

      if (IS_TEST_MODE) {
        statusDiv.innerText = "Test Mode: Notification coming in 5 seconds...";
      } else {
        statusDiv.innerText = "Notifications enabled successfully! You're all set.";
      }

      if ('serviceWorker' in navigator && navigator.serviceWorker.controller) {
        navigator.serviceWorker.controller.postMessage({
          type: 'SCHEDULE_NOTIFICATION',
          title: title,
          options: options,
          delayMs: delayMs
        });
      } else {
        setTimeout(() => {
          new Notification(title, options);
          if (IS_TEST_MODE) statusDiv.innerText = "Test notification sent!";
        }, delayMs);
      }
    }

    // 4. BUTTON EVENT
    enableBtn.addEventListener('click', async () => {
      if (!("Notification" in window)) {
        alert("This browser does not support notifications.");
        return;
      }

      const permission = await Notification.requestPermission();
      
      if (permission === "granted") {
        enableBtn.style.display = "none";
        await registerSw();
        scheduleSurprise();
      } else {
        statusDiv.style.color = "#d63031";
        statusDiv.innerText = "Please allow notifications in browser settings to continue.";
      }
    });
  </script>
</body>
</html>
